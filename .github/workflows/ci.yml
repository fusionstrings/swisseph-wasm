
name: CI

on:
  push:
    branches: [creation]
  pull_request:
    branches: [creation]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Git Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install LLVM (Clang)
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm clang

      - name: Build WASM
        run: deno task build
        env:
          CC: clang

      - name: Run Tests
        run: deno task test

      - name: Run Benchmarks
        run: deno task bench

      - name: Build NPM Package
        run: deno task build:npm

      - name: Build Browser Package
        run: deno task build:browser

      - name: Verify Node.js Support
        run: node tests/node_verification.js

      - name: Check Browser Artifacts
        run: |
          test -f lib/browser/swisseph_wasm.js
          test -f npm/browser/swisseph_wasm.js
